plugins { id 'com.android.application' }

android {
    namespace 'com.openai.sf2farmer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.sf2farmer'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2-punch-only-menu-fix'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

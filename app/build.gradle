plugins { id 'com.android.application' }

android {
    namespace 'com.openai.sf2farmer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.openai.sf2farmer'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3-loop'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
// Do not deliver a debug APK unless the screenshot loop regression passes.
tasks.configureEach { if (name == 'assembleDebug') dependsOn 'testDebugUnitTest' }
